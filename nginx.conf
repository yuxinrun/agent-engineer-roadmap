server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态站点（含 basePath /agent-engineer-roadmap）
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 缓存静态资源
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
